# Local development infrastructure: PostgreSQL + MinIO (S3-compatible storage).
# Production uses managed equivalents — these are for `docker compose up` locally.
services:
  postgres:
    image: postgres:16-alpine
    container_name: portagast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portagast
      POSTGRES_PASSWORD: portagast
      POSTGRES_DB: portagast
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portagast']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: portagast-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job that creates the bucket on first start.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio'; sleep 2; done;
      mc mb --ignore-existing local/portagast-documents;
      mc anonymous set none local/portagast-documents;
      exit 0;
      "
